<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product DNA · 研究后台</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f5fb;color:#29213f;font:15px system-ui}header{padding:22px 5%;background:#fff;border-bottom:1px solid #e6dff0;display:flex;justify-content:space-between;align-items:center}a{color:#7855b6}main{max-width:1250px;margin:35px auto;padding:0 24px}h1{font-size:32px;margin:10px 0}p,small{color:#82758f}button,input,textarea,select{font:inherit;border-radius:9px;border:1px solid #dfd5eb;padding:11px}button{background:#7954c1;color:white;cursor:pointer}input,textarea,select{background:white;color:#29213f}button.secondary{background:#f0eafa;color:#684696}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:25px 0}.card{background:white;border:1px solid #e6dff0;border-radius:17px;padding:22px}.stats strong{font-size:32px;display:block;margin-top:10px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.tools input{flex:1;min-width:180px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:20px}.record{display:block;text-align:left;width:100%;margin:10px 0;padding:17px;background:#faf8fe;color:#29213f}.record.selected{border-color:#7954c1;background:#eee6fb}.record small{display:block;margin-top:7px}.hidden{display:none!important}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.7 system-ui;background:#f8f5fc;padding:15px;border-radius:10px;max-height:350px;overflow:auto}textarea{width:100%;min-height:100px}img{width:100%;border-radius:12px}label{display:block;margin:18px 0 8px}#message{min-height:25px;color:#7450af}#login{max-width:420px;margin:80px auto}#login input{width:100%;margin:18px 0}button:disabled{opacity:.5}#list{max-height:700px;overflow:auto}@media(max-width:800px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
</style><header><b>✦ Product DNA Studio <small> / 研究后台</small></b><nav><a href="/">互动网页 ↗</a> <button class="secondary hidden" id="logout">退出</button></nav></header><main><section class="card" id="login"><h1>研究者登录</h1><p>查看参与者、原始输入与产出副本。</p><form id="loginForm"><input type="password" id="password" autocomplete="current-password" placeholder="后台密码" required><button>登录后台</button></form></section><div id="message" role="status"></div><section id="app" class="hidden"><small>PRODUCT RESEARCH / 工作台</small><h1>每一份经历，都值得被看见。</h1><p>保留提交时的原始输入与图像快照，让验证和下一轮迭代有据可依。</p><div class="stats" id="stats"></div><div class="tools"><input id="search" placeholder="搜索参与者、联系方式或审核备注" aria-label="搜索"><select id="filter" aria-label="审核状态"><option value="">全部状态</option><option value="pending">待审核</option><option value="reviewed">已审核</option><option value="followup">待跟进</option></select><button id="refresh" class="secondary">刷新</button><button id="export">导出全部 JSON</button></div><div class="layout"><section class="card"><b>提交记录</b><small> · 同一人可有多次提交</small><div id="list"></div></section><section class="card" id="detail"><p>选择一条记录，查看原始输入和产出副本。</p></section></div></section></main><script>
const $=x=>document.getElementById(x),labels={pending:'待审核',reviewed:'已审核',followup:'待跟进'};let rows=[],selected=null,current=null;
function message(s){$('message').textContent=s}
async function api(url,body){let r=await fetch(url,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});let data=await r.json();if(!r.ok){if(r.status===401){$('app').classList.add('hidden');$('login').classList.remove('hidden')}throw Error(data.error||'请求失败')}return data}
function download(data,name){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([typeof data==='string'?data:JSON.stringify(data,null,2)],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function load(){try{rows=await api('/api/admin/records');$('app').classList.remove('hidden');$('login').classList.add('hidden');$('logout').classList.remove('hidden');$('stats').replaceChildren();for(let [n,v] of [['提交总数',rows.length],['待审核',rows.filter(r=>r.status==='pending').length],['已审核',rows.filter(r=>r.status==='reviewed').length],['待跟进',rows.filter(r=>r.status==='followup').length]]){let d=document.createElement('div');d.className='card';d.textContent=n;let b=document.createElement('strong');b.textContent=v;d.append(b);$('stats').append(d)}render()}catch(e){message(e.message)}}
function render(){let q=$('search').value.toLowerCase(),f=$('filter').value;let visible=rows.filter(r=>(!f||r.status===f)&&[r.participant,r.contact,r.note].join(' ').toLowerCase().includes(q));$('list').replaceChildren();if(!visible.length)$('list').textContent='暂无匹配的提交记录。';for(let r of visible){let b=document.createElement('button');b.className='record'+(selected===r.id?' selected':'');b.textContent=r.participant+' · '+labels[r.status];let s=document.createElement('small');s.textContent=(r.contact||'未提供联系方式')+' · '+new Date(r.created).toLocaleString();b.append(s);b.onclick=()=>open(r.id);$('list').append(b)}}
async function open(id){try{let r=await api('/api/admin/records/'+id);selected=id;current=r;render();$('detail').innerHTML='<h2 id="who"></h2><small id="meta"></small><h3>原始输入</h3><pre id="story"></pre><h3>产出快照</h3><img id="snapshot" alt="参与者提交时的 DNA 图片"><details><summary>产出结构化数据</summary><pre id="result"></pre></details><div class="tools"><button id="copy">复制产出文字</button><button id="one" class="secondary">导出这条记录</button><button id="png" class="secondary">下载 PNG</button></div><label for="review">审核状态</label><select id="review"><option value="pending">待审核</option><option value="reviewed">已审核</option><option value="followup">待跟进</option></select><label for="note">验证记录 / 迭代想法</label><textarea id="note" maxlength="5000"></textarea><div class="tools"><button id="save">保存审核</button><button id="delete" class="secondary">删除记录</button></div>';$('who').textContent=r.participant;$('meta').textContent=(r.contact||'未提供联系方式')+' · '+new Date(r.created).toLocaleString()+' · 同意版本 '+r.consent_version;$('story').textContent=r.story;$('result').textContent=JSON.stringify(r.result,null,2);$('snapshot').src=r.image;$('review').value=r.status;$('note').value=r.note;$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(r.result,null,2));message('产出已复制')}catch{message('浏览器不允许复制，请导出记录。')}};$('one').onclick=()=>download(r,'dna-'+id+'.json');$('png').onclick=()=>{let a=document.createElement('a');a.href=r.image;a.download='dna-'+id+'.png';a.click()};$('save').onclick=async()=>{try{await api('/api/admin/records/'+id,{status:$('review').value,note:$('note').value});message('审核已保存');await load()}catch(e){message(e.message)}};$('delete').onclick=async()=>{if(!confirm('永久删除这条输入、产出与审核记录？'))return;try{await api('/api/admin/records/'+id,{action:'delete'});selected=null;$('detail').textContent='记录已删除';await load()}catch(e){message(e.message)}}}catch(e){message(e.message)}}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/login',{password:$('password').value});$('password').value='';message('');await load()}catch(e){message(e.message)}};$('logout').onclick=async()=>{await api('/api/admin/logout',{});location.reload()};$('search').oninput=render;$('filter').onchange=render;$('refresh').onclick=load;$('export').onclick=async()=>{try{download(await api('/api/admin/export'),'dna-submissions.json')}catch(e){message(e.message)}};load();
</script></html>
