# Standalone, stateless Career DNA Studio. No database or persistent disk.
services:
  - type: web
    name: career-dna-studio
    runtime: python
    plan: free
    buildCommand: python build_preview.py && python -m compileall -q ai_server.py career_ai.py
    startCommand: python ai_server.py
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: DAILY_GENERATION_LIMIT
        value: "10"
