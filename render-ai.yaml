# Existing API service: retain its identity and secret environment values.
services:
  - type: web
    name: product-dna-studio-ai
    runtime: python
    plan: free
    buildCommand: python build_preview.py && python -m compileall -q ai_server.py career_ai.py
    startCommand: python ai_server.py
    healthCheckPath: /health
    envVars:
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: DAILY_GENERATION_LIMIT
        value: "10"
      - key: OPENAI_API_KEY
        sync: false
